# Switches the site to its after-release version at 12:00 noon Eastern on 17 November, with nobody at
# the keyboard. The after-release files wait in a draft release ("launch-bundle") as one encrypted
# bundle; its passphrase is the LAUNCH_KEY secret, so nothing in it can be read before the launch.
#
# Scheduled runs can start late or, now and then, not at all, so two are set to start well before the
# moment. Each opens and checks the bundle, waits for the second, then commits and deploys. The second
# one finds the first already done and stops. To launch by hand (or to try it out first):
#   Actions → "Launch the Mega Dimension" → Run workflow → rehearse | launch
#
# The same run releases the game: the v1.3.0 commit waits beside the site bundle as an encrypted git
# bundle, and the GitHub release on the game repo waits as a draft with its notes and patch attached.
# At the moment the game job pushes the commit to master, tags it v1.3.0 and publishes the draft. It
# needs the GAME_RELEASE_TOKEN secret: a fine-grained token for the game repo with Contents read/write.
name: Launch the Mega Dimension

on:
  schedule:
    - cron: "15 16 17 11 *"     # 16:15 UTC, 17 Nov
    - cron: "35 16 17 11 *"     # 16:35 UTC, 17 Nov
  workflow_dispatch:
    inputs:
      mode:
        description: "rehearse = open the bundle and keep the launched site as a download, publish nothing; launch = wait for the moment, then go live"
        type: choice
        options: [rehearse, launch]
        default: rehearse

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  LAUNCH_AT: "2026-11-17T17:00:00Z"   # 12:00 noon Eastern (EST, UTC-5)
  BUNDLE_TAG: launch-bundle
  BUNDLE_FILE: launch-bundle.tar.gz.gpg
  GAME_REPO: jmaloney95/Wishes-Game
  GAME_TAG: v1.3.0
  GAME_BASE: dca6820550a4bf563e54616a543af17dac4efcac   # the game repo's master before the release (v1.2.6)
  GAME_SHA: 21347042e1b4dc9d220a18f0ce6bd4c9e4de71f9    # the v1.3.0 commit, sealed in GAME_BUNDLE
  GAME_BUNDLE: game-v1.3.0.bundle.gpg
  GAME_ASSET: wishes-of-tomorrow-1.3.0.bps

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Already launched?
        id: state
        run: |
          mode='${{ github.event_name == 'schedule' && 'launch' || inputs.mode }}'
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = launch ] && [ -f .github/launch/launched ]; then
            echo "Already launched at $(cat .github/launch/launched); nothing to do."
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the sealed bundle
        if: steps.state.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # drafts aren't found by tag, so look the asset up in the release list
          url=$(gh api "repos/${{ github.repository }}/releases" \
                --jq ".[] | select(.tag_name == \"$BUNDLE_TAG\") | .assets[] | select(.name == \"$BUNDLE_FILE\") | .url" | head -n1)
          [ -n "$url" ] || { echo "::error::no $BUNDLE_FILE in a release tagged $BUNDLE_TAG"; exit 1; }
          gh api -H "Accept: application/octet-stream" "$url" > "$RUNNER_TEMP/$BUNDLE_FILE"
          ls -l "$RUNNER_TEMP/$BUNDLE_FILE"

      - name: Open it onto docs/
        if: steps.state.outputs.done != 'true'
        env:
          LAUNCH_KEY: ${{ secrets.LAUNCH_KEY }}
        run: bash .github/launch/open_bundle.sh "$RUNNER_TEMP/$BUNDLE_FILE" docs

      - name: Keep the rehearsal as a download
        if: steps.state.outputs.mode == 'rehearse'
        uses: actions/upload-artifact@v4
        with:
          name: launched-site
          path: docs
          retention-days: 7

      - name: Wait for the moment
        if: steps.state.outputs.done != 'true' && steps.state.outputs.mode == 'launch'
        run: |
          now=$(date -u +%s); at=$(date -u -d "$LAUNCH_AT" +%s); left=$((at - now))
          if [ "$left" -gt 12600 ]; then
            echo "::error::The launch is $((left / 60)) minutes away; start this within 3½ hours of it."
            exit 1
          fi
          if [ "$left" -gt 0 ]; then echo "Waiting $left s for $LAUNCH_AT"; sleep "$left"; fi
          date -u +%FT%TZ

      # Going live on time comes first: if the commit can't be pushed, the deploy still happens and the
      # last step fails loudly, so the launched files get committed by hand before anything else is pushed.
      - name: Commit the launched site
        id: commit
        if: steps.state.outputs.done != 'true' && steps.state.outputs.mode == 'launch'
        continue-on-error: true
        run: |
          git config user.name "Joe Maloney"
          git config user.email "35541449+jmaloney95@users.noreply.github.com"
          date -u +%FT%TZ > .github/launch/launched
          git add -A docs .github/launch/launched
          git commit -q -m "Site: the Mega Dimension is out"
          for try in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull -q --rebase origin main
          done
          echo "::error::couldn't push the launched site"; exit 1

      - uses: actions/configure-pages@v5
        if: steps.state.outputs.done != 'true' && steps.state.outputs.mode == 'launch'
      - uses: actions/upload-pages-artifact@v3
        if: steps.state.outputs.done != 'true' && steps.state.outputs.mode == 'launch'
        with:
          path: docs
      - id: deployment
        if: steps.state.outputs.done != 'true' && steps.state.outputs.mode == 'launch'
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000

      - name: Live but not committed?
        if: steps.commit.outcome == 'failure'
        run: |
          echo "::error::The launched site is live, but its files weren't committed. Commit them before pushing anything else, or the next deploy puts the before version back."
          exit 1

  game:
    name: Release the game
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Already released?
        id: state
        env:
          GH_TOKEN: ${{ secrets.GAME_RELEASE_TOKEN }}
        run: |
          mode='${{ github.event_name == 'schedule' && 'launch' || inputs.mode }}'
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          [ -n "$GH_TOKEN" ] || { echo "::error::The GAME_RELEASE_TOKEN secret isn't set, so the game can't be released from here."; exit 1; }
          # drafts aren't found by tag, so look the release up in the list
          draft=$(gh api "repos/$GAME_REPO/releases" --jq ".[] | select(.tag_name == \"$GAME_TAG\") | .draft" | head -n1)
          case "$draft" in
            false) echo "$GAME_TAG is already published; nothing to do."; echo "done=true" >> "$GITHUB_OUTPUT" ;;
            true)  echo "The $GAME_TAG draft is waiting." ;;
            *)     echo "::error::no release $GAME_TAG on $GAME_REPO (it should wait there as a draft)"; exit 1 ;;
          esac
          assets=$(gh api "repos/$GAME_REPO/releases" --jq ".[] | select(.tag_name == \"$GAME_TAG\") | .assets[].name")
          echo "$assets" | grep -qx "$GAME_ASSET" || { echo "::error::the $GAME_TAG draft has no $GAME_ASSET"; exit 1; }

      - name: Open the sealed release commit
        if: steps.state.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LAUNCH_KEY: ${{ secrets.LAUNCH_KEY }}
          GAME_TOKEN: ${{ secrets.GAME_RELEASE_TOKEN }}
        run: |
          git init -q game && cd game
          git config user.name "Joe Maloney"
          git config user.email "35541449+jmaloney95@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GAME_TOKEN}@github.com/${GAME_REPO}.git"
          git fetch -q --depth=1 origin master
          master=$(git rev-parse FETCH_HEAD)
          if [ "$master" = "$GAME_SHA" ]; then echo "master already has $GAME_TAG"; exit 0; fi
          [ "$master" = "$GAME_BASE" ] || { echo "::error::master is $master, not $GAME_BASE: someone pushed to it since the release was sealed"; exit 1; }
          url=$(gh api "repos/${{ github.repository }}/releases" \
                --jq ".[] | select(.tag_name == \"$BUNDLE_TAG\") | .assets[] | select(.name == \"$GAME_BUNDLE\") | .url" | head -n1)
          [ -n "$url" ] || { echo "::error::no $GAME_BUNDLE in a release tagged $BUNDLE_TAG"; exit 1; }
          gh api -H "Accept: application/octet-stream" "$url" > "$RUNNER_TEMP/$GAME_BUNDLE"
          printf '%s' "$LAUNCH_KEY" | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 \
            --decrypt --output "$RUNNER_TEMP/game.bundle" "$RUNNER_TEMP/$GAME_BUNDLE"
          git bundle verify "$RUNNER_TEMP/game.bundle"
          git fetch -q "$RUNNER_TEMP/game.bundle" "refs/heads/launch-v1.3.0:refs/heads/release"
          [ "$(git rev-parse release)" = "$GAME_SHA" ] || { echo "::error::the bundle doesn't hold $GAME_SHA"; exit 1; }
          [ "$(git rev-parse release^)" = "$GAME_BASE" ] || { echo "::error::$GAME_SHA isn't built on $GAME_BASE"; exit 1; }
          # proves the token can push and that it would be a plain fast-forward, without changing anything
          git push --dry-run --atomic origin "$GAME_SHA:refs/heads/master" "$GAME_SHA:refs/tags/$GAME_TAG"

      - name: Wait for the moment
        if: steps.state.outputs.done != 'true' && steps.state.outputs.mode == 'launch'
        run: |
          now=$(date -u +%s); at=$(date -u -d "$LAUNCH_AT" +%s); left=$((at - now))
          if [ "$left" -gt 12600 ]; then
            echo "::error::The launch is $((left / 60)) minutes away; start this within 3½ hours of it."
            exit 1
          fi
          if [ "$left" -gt 0 ]; then echo "Waiting $left s for $LAUNCH_AT"; sleep "$left"; fi
          date -u +%FT%TZ

      - name: Push v1.3.0 to master and tag it
        if: steps.state.outputs.done != 'true' && steps.state.outputs.mode == 'launch'
        run: |
          cd game
          for try in 1 2 3; do
            git push --atomic origin "$GAME_SHA:refs/heads/master" "$GAME_SHA:refs/tags/$GAME_TAG" && exit 0
            sleep 15
          done
          echo "::error::couldn't push $GAME_SHA to $GAME_REPO"; exit 1

      - name: Publish the release
        if: steps.state.outputs.done != 'true' && steps.state.outputs.mode == 'launch'
        env:
          GH_TOKEN: ${{ secrets.GAME_RELEASE_TOKEN }}
        run: |
          for try in 1 2 3; do
            gh release edit "$GAME_TAG" --repo "$GAME_REPO" --draft=false --latest && break
            [ "$try" = 3 ] && { echo "::error::couldn't publish the $GAME_TAG release"; exit 1; }
            sleep 15
          done
          gh release view "$GAME_TAG" --repo "$GAME_REPO" --json tagName,isDraft,url,assets \
            --jq '"\(.tagName) draft=\(.isDraft) \(.url)", (.assets[] | "  \(.name) \(.size) bytes")'
          curl -sL -r 0-0 -o /dev/null -w "patch download: HTTP %{http_code}\n" \
            "https://github.com/$GAME_REPO/releases/download/$GAME_TAG/$GAME_ASSET" \
            || echo "::warning::couldn't reach the release's patch download"
